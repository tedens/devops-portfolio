name: GitOps delivery

# This runs the drill, not a lint.
#
# The rollback claim is the only thing this project asserts, and the first
# three times it was run by hand it "passed" for reasons that had nothing to
# do with the canary: an empty Prometheus result indexed out of range, then a
# merge patch that stripped the container's port so the canary received no
# traffic at all. Both produced a rollback. Neither measured anything.
#
# A claim that is only checked by hand is checked once. This checks both
# directions on every change: a broken build must be rejected, and a healthy
# build must be promoted. An analysis that rejects everything passes the
# first test and is useless.

on:
  push:
    branches: [main]
    paths:
      - '16-gitops-delivery/**'
      - '.github/workflows/gitops.yml'
  pull_request:
    paths:
      - '16-gitops-delivery/**'
      - '.github/workflows/gitops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML parses
        run: |
          for f in $(find 16-gitops-delivery -name '*.yaml'); do
            ruby -ryaml -e 'YAML.load_stream(File.read(ARGV[0])) { |d| }' "$f"
          done
          echo "all manifests parse"

      - name: App has no syntax errors
        run: node --check 16-gitops-delivery/app/src/index.js

      - name: Manifests validate against real CRD schemas
        run: |
          # kubeconform with the CRD catalogue, so a typo in a Rollout field
          # fails here rather than at kubectl apply. The AnalysisTemplate that
          # carried podTemplateHashValue in the wrong place was rejected by
          # the API server; this is where that should have been caught.
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform \
            -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            16-gitops-delivery/manifests 16-gitops-delivery/apps

  drill:
    name: Rollback drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: manifests

    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: gitops-demo
          # Kept in step with bootstrap/versions.env by the check below.
          node_image: kindest/node:v1.31.4

      - name: Pinned versions match bootstrap/versions.env
        run: |
          # Two places naming a version is one place too many, and the one
          # that drifts is always the one nobody runs locally.
          source 16-gitops-delivery/bootstrap/versions.env
          grep -q "node_image: $KIND_NODE_IMAGE" .github/workflows/gitops.yml \
            || { echo "node image in this workflow does not match versions.env ($KIND_NODE_IMAGE)"; exit 1; }
          echo "versions agree"

      - name: Bring up the stack
        working-directory: 16-gitops-delivery
        run: |
          # --local: Argo CD would pull this repo at main, which on a pull
          # request is not the code under test. The app of apps is exercised
          # separately below against whatever main currently holds.
          ./scripts/up.sh --local

      - name: A broken build is rejected and rolled back
        working-directory: 16-gitops-delivery
        run: |
          ./scripts/reset.sh
          ./scripts/rollback-drill.sh

      - name: A healthy build is promoted
        working-directory: 16-gitops-delivery
        run: |
          ./scripts/reset.sh
          ./scripts/rollback-drill.sh --healthy

      - name: The analysis measured real numbers
        working-directory: 16-gitops-delivery
        run: |
          # The drill passing is not enough on its own. An analysis that
          # errors also aborts a rollout, and an aborted rollout looks like a
          # successful rollback. Assert every measurement carries a value.
          empty=$(kubectl -n demo get analysisrun -o json |
            jq '[.items[].status.metricResults[]?.measurements[]?
                 | select((.value // "[]") == "[]")] | length')
          echo "measurements with no value: $empty"
          [ "$empty" = "0" ] || {
            echo "the gate reached a verdict without measuring anything"
            kubectl -n demo get analysisrun -o yaml | grep -A4 measurements
            exit 1
          }

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n demo get rollout demo-service -o yaml || true
          kubectl -n demo get analysisrun -o yaml || true
          kubectl -n demo get endpointslice -o wide || true
          kubectl -n monitoring logs deploy/prometheus --tail=50 || true
          kubectl -n argo-rollouts logs deploy/argo-rollouts --tail=100 || true

  gitops-path:
    name: App of apps against main
    # Only after merge: Argo CD pulls this repository at main, so on a pull
    # request it would sync code that is not the code under test.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Bring-up is about six minutes and the drill another five, on a runner
    # slower than a laptop.
    timeout-minutes: 30
    needs: manifests

    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: gitops-demo
          node_image: kindest/node:v1.31.4

      - name: Bring up through Argo CD
        working-directory: 16-gitops-delivery
        run: ./scripts/up.sh

      - name: Every Application is Synced and Healthy
        run: |
          # The --local path applies the directory with kubectl, which goes in
          # filename order. Argo CD does not, and that difference produced a
          # Rollout referencing an AnalysisTemplate that did not exist yet.
          # It self-healed, so only a check on the real path catches it.
          for _ in $(seq 1 60); do
            bad=$(kubectl -n argocd get applications -o json | jq -r '
              [.items[] | select(.status.sync.status != "Synced"
                                 or .status.health.status != "Healthy")
               | .metadata.name] | join(",")')
            [ -z "$bad" ] && { echo "all Applications Synced and Healthy"; exit 0; }
            sleep 10
          done
          echo "not settled: $bad"
          kubectl -n argocd get applications -o wide
          kubectl -n demo get rollout demo-service -o jsonpath='{.status.message}'
          exit 1

      - name: The Rollout never went InvalidSpec
        run: |
          # Sync waves put the AnalysisTemplate in before the Rollout. If the
          # ordering regresses, this is the message that comes back.
          if kubectl -n demo get rollout demo-service -o yaml | grep -q "InvalidSpec"; then
            echo "the Rollout was rejected; check the sync-wave annotations"
            kubectl -n demo get rollout demo-service -o yaml | grep -B2 -A2 InvalidSpec
            exit 1
          fi
          echo "no InvalidSpec"

      - name: The drill works with Argo CD managing the cluster
        working-directory: 16-gitops-delivery
        run: |
          # This is the case that broke twice. selfHeal reverts the drill's
          # out-of-band image change, and suspending the child Application is
          # not enough because the root Application heals that too. Both
          # times the result was a rollout that never happened.
          ./scripts/rollback-drill.sh

      - name: Automated sync was put back
        run: |
          # The drill suspends sync and restores it from a trap. A drill that
          # leaves auto-sync off has disabled the thing the project is about.
          missing=$(kubectl -n argocd get applications -o json | jq -r '
            [.items[] | select(.spec.syncPolicy.automated == null) | .metadata.name] | join(",")')
          [ -z "$missing" ] || { echo "automated sync still off for: $missing"; exit 1; }
          echo "automated sync restored on every Application"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o yaml || true
          kubectl -n argocd logs deploy/argocd-application-controller --tail=100 || true
          kubectl -n demo get rollout demo-service -o yaml || true
          kubectl -n demo get analysisrun -o yaml || true
          kubectl -n demo get all || true
