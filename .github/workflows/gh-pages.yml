name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      # Tracked as Readme.md, and GitHub's path filters are case-sensitive.
      - 'Readme.md'
      - 'scripts/sync-readme.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The README project table is generated from the same projects.yaml that
      # drives this site. It had drifted into two tables, one of them stale and
      # missing its header row. Fail here rather than let them diverge again.
      - name: Check README is in sync with projects.yaml
        run: python3 scripts/sync-readme.py --check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll (from docs folder)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
