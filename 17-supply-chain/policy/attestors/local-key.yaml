# Who the cluster trusts in the local drill: one key pair, generated by
# scripts/sign-local.sh and never committed, standing in for both identities.
# There is no independent builder on a laptop, so the provenance here is
# self-attested and the policy says so through EXPECTED_BUILDER_ID_PREFIX.
#
# The transparency log is the public one, same as CI, and that is not a
# convenience. Kyverno 1.19.1 tolerates a missing log entry on a signature
# when insecureIgnoreTlog is set, and does not extend that tolerance to
# attestations: an SBOM attached with --tlog-upload=false fails as "cosign
# bundle verification failed" no matter what the policy says. Uploading is
# also the honest choice. A signature nobody can look up later is a signature
# you have to take the signer's word for.
attestors:
  - name: builder
    cosign:
      key:
        data: |
          LOCAL_PUBLIC_KEY
      ctlog:
        url: https://rekor.sigstore.dev
  - name: provenance
    cosign:
      key:
        data: |
          LOCAL_PUBLIC_KEY
      ctlog:
        url: https://rekor.sigstore.dev
