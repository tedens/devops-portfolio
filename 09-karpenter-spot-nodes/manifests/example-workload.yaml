# What a workload has to look like to be safe on spot. Karpenter handles the
# node; these three things are what stop a reclaim becoming an outage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 6
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      # 1. Spread across nodes and zones, so losing one node or one spot pool
      #    cannot take a majority of replicas with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: web }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }

      # 2. Shut down inside the two minutes a spot notice gives you.
      terminationGracePeriodSeconds: 60

      # 4. Run as a normal user with nothing extra. Caught by the compliance
      #    gate in project 15, which is the point of having one: this file is
      #    held up as the example, so it has to survive its own policy.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          # Unprivileged variant, so nothing needs to bind below port 1024.
          image: public.ecr.aws/nginx/nginx-unprivileged:1.27
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
          # 3. Requests, so Karpenter can size a node correctly. Without them
          #    it guesses, and consolidation cannot reason about the fit.
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
          lifecycle:
            preStop:
              exec:
                # Let the load balancer notice before the process goes away.
                command: ["sh", "-c", "sleep 10"]

      # A read-only root filesystem needs somewhere writable for the bits
      # that genuinely have to be written.
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
# The backstop. Karpenter honours PDBs during voluntary disruption, so this
# is what stops consolidation draining the whole deployment at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 4
  selector:
    matchLabels: { app: web }
