  - title: "PHI-Safe Telemetry Pipeline"
    repo: "github.com/tedens/phi-telemetry"
    url: "https://github.com/tedens/phi-telemetry"
    desc: "Custom OpenTelemetry Collector processor in Go that scrubs PHI (MRNs, SSNs, dates of birth, member IDs, emails, phone numbers, addresses) and credentials from traces, logs, and metrics before they leave the node. Helm chart for EKS with TLS 1.3 on every hop and agent-to-gateway mTLS. A leak drill plants synthetic PHI and searches every backend, then disables redaction and confirms the same search finds every injected identifier."
