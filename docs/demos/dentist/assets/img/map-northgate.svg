    <rect x="230" y="40" width="160" height="110" rx="6"/>
    <rect x="40" y="200" width="150" height="90" rx="6"/>
    <rect x="230" y="200" width="160" height="90" rx="6"/>
    <rect x="430" y="210" width="140" height="80" rx="6"/>
