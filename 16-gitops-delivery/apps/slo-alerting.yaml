# Project 18's rules, Alertmanager and notification sink, delivered the same
# way as everything else: Argo CD renders the kustomization and keeps the
# cluster matching git. The rules ConfigMap it produces is the one project
# 16's Prometheus mounts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-alerting
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tedens/devops-portfolio.git
    targetRevision: main
    path: 18-slo-alerting
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
