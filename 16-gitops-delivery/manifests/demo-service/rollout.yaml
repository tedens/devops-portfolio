# A canary that is actually gated.
#
# The steps below are not a timer. Each setWeight is followed by a pause, and
# the analysis runs alongside from the first step onward. If the success rate
# drops below the threshold the Rollout aborts on its own and all traffic
# returns to the stable ReplicaSet. Nobody is watching a dashboard for this.

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-service
  namespace: demo
spec:
  replicas: 5
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: demo-service

  strategy:
    canary:
      canaryService: demo-service-canary
      stableService: demo-service-stable

      # Start the analysis with the first shift of traffic rather than after
      # the last one. Analysis that only runs at 100% is a post-mortem.
      analysis:
        templates:
          - templateName: success-rate
        startingStep: 1
        args:
          - name: service-name
            value: demo-service-canary
          # The controller fills this in with the pod-template-hash of the
          # ReplicaSet being analysed. It is what scopes the Prometheus query
          # to the canary rather than the whole fleet.
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest

      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 80
        - pause: { duration: 60s }

  template:
    metadata:
      labels:
        app: demo-service
      annotations:
        # Without these the pod is never scraped, the analysis query returns
        # no data, and the canary is promoted on the strength of a missing
        # measurement. That failure is silent, which makes it the worst one.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Matches the standard the compliance gate enforces on project 09's
      # example workload, which was running as root while being held up as
      # the example to copy.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 10

      containers:
        - name: app
          image: demo-service:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: BUILD_VERSION
              value: v1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
