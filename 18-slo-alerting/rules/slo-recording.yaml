# Service level indicators for demo-service, precomputed at the windows the
# burn-rate alerts need.
#
# Two SLIs. Availability: the fraction of requests that returned 5xx. Latency:
# the fraction served slower than 250ms, from the histogram the service
# exposes. Both are expressed as *error* ratios (bad / total) because the
# alerts compare them against a budget, and a budget is an allowance of
# errors, not of successes.
#
# Windows are the SRE-workbook set: 5m, 30m, 1h, 2h, 6h, 1d, 3d. Each alert
# pairs a long window (is the budget really being spent?) with a short one
# (is it still happening?), which is what stops an alert firing for an hour
# after the incident has ended.
#
# ---------------------------------------------------------------------------
# Two levels, not one, and the reason is pod churn.
#
# The obvious way to compute a one-hour error ratio is
#
#   sum(rate(errors[1h])) / sum(rate(total[1h]))
#
# and it does not measure an hour. rate() dilutes over its window, but both
# sides are diluted by the same window and the ratio cancels it; what is left
# is errors over total across whatever samples exist inside the window. For
# a fleet that was recreated fifteen minutes ago, the "1h" ratio is a
# 15-minute ratio. For a canary that lived ninety seconds and was rolled
# back, its errors dominate every long window until its samples age out. The
# first version of these rules paged for 25 minutes after a 90-second burn,
# and paged too early during it, for the same reason. That is the exact
# failure multi-window alerting exists to prevent, defeated by the exact
# event it is meant to cover.
#
# So the rates are taken once, at 5m, over whatever series are alive, and
# recorded as continuous series. The long windows are averages over time of
# those. avg_over_time of a per-second rate over an hour of samples is total
# errors in that hour over 3600, which is the number the obvious query
# claims to be, and a pod that has stopped being scraped stops contributing
# at once.
#
# Both level-1 series carry "or vector(0)", and it has to be both. The
# averages must be taken over the same set of timestamps: with a zero
# recorded for errors at a moment when requests recorded nothing, one average
# has an extra sample and the ratio is off (0.514 for a true 0.6 in the unit
# tests). With zeros on both sides they cancel. No traffic still yields 0/0,
# which is NaN, and every comparison against NaN is false: no traffic is not
# an error-budget burn, and it has its own alert.
# ---------------------------------------------------------------------------

groups:
  - name: slo.demo-service.recording
    interval: 30s
    rules:
      # ---------------- level 1: per-second rates over live series ----------------
      - record: slo:sli_errors:rate5m
        labels: { service: demo-service, slo: availability }
        expr: |
          sum(rate(http_requests_total{app="demo-service",status_class="5xx"}[5m]))
          or vector(0)
      - record: slo:sli_requests:rate5m
        labels: { service: demo-service, slo: availability }
        expr: |
          sum(rate(http_requests_total{app="demo-service"}[5m]))
          or vector(0)

      - record: slo:sli_errors:rate5m
        labels: { service: demo-service, slo: latency }
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{app="demo-service"}[5m]))
            - sum(rate(http_request_duration_seconds_bucket{app="demo-service",le="0.25"}[5m]))
          )
          or vector(0)
      - record: slo:sli_requests:rate5m
        labels: { service: demo-service, slo: latency }
        expr: |
          sum(rate(http_request_duration_seconds_count{app="demo-service"}[5m]))
          or vector(0)

      # ---------------- level 2: ratios per window ----------------
      - record: slo:sli_error:ratio_rate5m
        expr: |
          slo:sli_errors:rate5m / slo:sli_requests:rate5m

      - record: slo:sli_error:ratio_rate30m
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[30m])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[30m])
      - record: slo:sli_error:ratio_rate1h
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[1h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[1h])
      - record: slo:sli_error:ratio_rate2h
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[2h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[2h])
      - record: slo:sli_error:ratio_rate6h
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[6h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[6h])
      - record: slo:sli_error:ratio_rate1d
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[1d])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[1d])
      - record: slo:sli_error:ratio_rate3d
        labels: { slo: availability }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="availability"}[3d])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="availability"}[3d])

      - record: slo:sli_error:ratio_rate30m
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[30m])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[30m])
      - record: slo:sli_error:ratio_rate1h
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[1h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[1h])
      - record: slo:sli_error:ratio_rate2h
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[2h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[2h])
      - record: slo:sli_error:ratio_rate6h
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[6h])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[6h])
      - record: slo:sli_error:ratio_rate1d
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[1d])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[1d])
      - record: slo:sli_error:ratio_rate3d
        labels: { slo: latency }
        expr: |
          avg_over_time(slo:sli_errors:rate5m{service="demo-service",slo="latency"}[3d])
          / avg_over_time(slo:sli_requests:rate5m{service="demo-service",slo="latency"}[3d])

      # The objectives, as series, so dashboards and alerts read one number
      # from one place. 99.9% availability; 99% of requests under 250ms.
      - record: slo:objective:ratio
        labels: { service: demo-service, slo: availability }
        expr: "0.999"
      - record: slo:objective:ratio
        labels: { service: demo-service, slo: latency }
        expr: "0.99"
      - record: slo:error_budget:ratio
        expr: 1 - slo:objective:ratio
